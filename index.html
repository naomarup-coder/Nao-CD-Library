<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#29264f">
  <meta name="description" content="持っているCDの曲目と歌詞カードを管理するライブラリ">
  <title>118 CD Library</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <button class="brand" type="button" id="homeButton" aria-label="ホームへ戻る">💿 118 CD Library</button>
      <button class="button button-header" type="button" id="qrButton">ライブラリQR</button>
    </div>
    <p class="site-subtitle">持っているCDの曲目と歌詞カードを、ひとつの場所で管理</p>
  </header>

  <main class="page-container" id="app" aria-live="polite">
    <p class="loading-message">ライブラリを読み込んでいます…</p>
  </main>

  <dialog class="dialog" id="dialog">
    <div class="dialog-content" id="dialogContent"></div>
  </dialog>

  <footer class="site-footer">
    <p>118 CD Library</p>
    <p>データのバックアップを定期的に保存してください。</p>
  </footer>

</html>
